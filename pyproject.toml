[project]
name = "gold-shop"
version = "0.1.0"
description = "Gold jewelry shop management system"
requires-python = ">=3.12,<3.14"
readme = "README.md"

dependencies = [
    # API
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.16,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "asyncpg>=0.30,<1.0",

    # Validation & configuration
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "email-validator>=2.2,<3.0",

    # Authentication
    "pyjwt>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",

    # Async / background workers
    "redis>=6.0,<7.0",
    "celery>=5.5,<6.0",

    # HTTP client
    "httpx>=0.28,<1.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",

    # HTTP testing
    "httpx>=0.28,<1.0",

    # Linting / formatting
    "ruff>=0.12,<1.0",

    # Type checking
    "mypy>=1.17,<2.0",

    # Pre-commit
    "pre-commit>=4.3,<5.0",

    # Test coverage
    "pytest-cov>=6.2,<7.0",
]

[project.scripts]
gold-shop = "app.main:main"


# ============================================================
# Ruff
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # async checks
    "S",      # security checks
]

ignore = [
    "B008",   # FastAPI Depends() in function defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert is expected in tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ============================================================
# MyPy
# ============================================================

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

exclude = [
    "alembic/versions",
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
]
ignore_missing_imports = true


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = [
    ".",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
]


# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async engine switches through greenlets during database calls.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80


# ============================================================
# Build system
# ============================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
